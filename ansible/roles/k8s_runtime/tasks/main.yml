---
- name: "Render Kubernetes runtime isolation manifests"
  ansible.builtin.template:
    src: runtime-isolation.yaml.j2
    dest: /tmp/runtime-isolation.yaml
    mode: '0644'

- name: "Apply runtime isolation manifests"
  ansible.builtin.command:
    cmd: kubectl apply -f /tmp/runtime-isolation.yaml
  changed_when: true

- name: "Clean up temporary isolation manifest"
  ansible.builtin.file:
    path: /tmp/runtime-isolation.yaml
    state: absent

- name: "Create argocd namespace"
  ansible.builtin.command:
    cmd: kubectl create namespace argocd
  register: create_ns_argocd
  failed_when: create_ns_argocd.rc != 0 and "already exists" not in create_ns_argocd.stderr
  changed_when: create_ns_argocd.rc == 0

- name: "Install ArgoCD manifests (Server-Side Apply to avoid annotation size limit)"
  ansible.builtin.command:
    cmd: kubectl apply -n argocd --server-side --force-conflicts -f https://raw.githubusercontent.com/argoproj/argo-cd/stable/manifests/install.yaml
  register: argocd_install
  changed_when: "'created' in argocd_install.stdout or 'configured' in argocd_install.stdout or 'server-side-applied' in argocd_install.stdout"

- name: "Render ArgoCD Ingress manifest"
  ansible.builtin.template:
    src: argocd-ingress.yaml.j2
    dest: /tmp/argocd-ingress.yaml
    mode: '0644'

- name: "Apply ArgoCD Ingress"
  ansible.builtin.command:
    cmd: kubectl apply -f /tmp/argocd-ingress.yaml
  changed_when: true

- name: "Clean up temporary ingress manifest"
  ansible.builtin.file:
    path: /tmp/argocd-ingress.yaml
    state: absent
