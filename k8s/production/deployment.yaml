apiVersion: v1
kind: ServiceAccount
metadata:
  name: nexus-sa
  namespace: production
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nexus-app
  namespace: production
  labels:
    app: nexus-app
    env: production
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: nexus-app
  template:
    metadata:
      labels:
        app: nexus-app
      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/vault-addr: "http://vault-internal.vault.svc.cluster.local:8200"
        vault.hashicorp.com/vault-address: "http://vault-internal.vault.svc.cluster.local:8200"
        vault.hashicorp.com/role: "nexus-app-role"
        vault.hashicorp.com/agent-inject-secret-db-creds: "secret/data/nexus/database"
        vault.hashicorp.com/agent-inject-template-db-creds: |
          {{- with secret "secret/data/nexus/database" -}}
          DB_USER={{ .Data.data.username }}
          DB_PASSWORD={{ .Data.data.password }}
          {{- end -}}
    spec:
      serviceAccountName: nexus-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nexus-app
          image: ghcr.io/pikz-eng/nexus-app:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              protocol: TCP
          env:
            - name: APP_ENV
              value: "production"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            limits:
              cpu: "500m"
              memory: "512Mi"
            requests:
              cpu: "100m"
              memory: "128Mi"
          volumeMounts:
            - name: tmp-volume
              mountPath: /tmp
      volumes:
        - name: tmp-volume
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: nexus-service
  namespace: production
spec:
  selector:
    app: nexus-app
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
