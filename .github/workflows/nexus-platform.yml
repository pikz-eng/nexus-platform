name: Nexus Platform CI/CD

on:
  push:
    branches: [ "production", "staging" ]
  pull_request:
    branches: [ "production" ]

permissions:
  contents: write
  id-token: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/nexus-app
  VAULT_ADDR: http://63.180.183.215:32000

jobs:
  shift-left-security:
    name: 1. Shift-Left Security Scans
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 2. Gitleaks Secret Detection
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 3. Semgrep SAST Scan
        uses: returntocorp/semgrep-action@v1
        with:
          config: >-
            p/security-audit
            p/owasp-top-ten

      - name: 4. Trivy SCA Filesystem Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

  build-and-sign:
    name: 2. Build, Scan & Sign Container
    needs: shift-left-security
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ github.ref_name }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3.5.0

      - name: 5. Authenticate with Vault via OIDC (JWT)
        id: vault-auth
        run: |
          ACTIONS_ID_TOKEN_REQUEST_TOKEN="${ACTIONS_ID_TOKEN_REQUEST_TOKEN}"
          ACTIONS_ID_TOKEN_REQUEST_URL="${ACTIONS_ID_TOKEN_REQUEST_URL}"
          
          OIDC_TOKEN=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https://github.com/pikz-eng" | jq -r '.value')

          VAULT_TOKEN=$(curl -s --request POST \
            --data "{\"jwt\": \"$OIDC_TOKEN\", \"role\": \"github-actions-role\"}" \
            "$VAULT_ADDR/v1/auth/jwt/login" | jq -r '.auth.client_token')

          if [ "$VAULT_TOKEN" = "null" ] || [ -z "$VAULT_TOKEN" ]; then
            echo "Eroare: Nu s-a putut obține token-ul Vault prin OIDC."
            exit 1
          fi

          echo "::add-mask::$VAULT_TOKEN"
          echo "VAULT_TOKEN=$VAULT_TOKEN" >> $GITHUB_ENV

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 6. Docker Build
        id: build
        run: |
          IMAGE_TAG="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
          LATEST_TAG="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"
          docker build -t "$IMAGE_TAG" -t "$LATEST_TAG" .
          docker push "$IMAGE_TAG"
          docker push "$LATEST_TAG"
          echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_ENV

      - name: 7. Trivy Container Vulnerability Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE_TAG }}
          format: 'table'
          severity: 'CRITICAL'
          exit-code: '0'

      - name: 8. Cosign Signing via Vault Transit
        run: |
          cosign sign --yes \
            --key "hashivault://cosign-key" \
            "${{ env.IMAGE_TAG }}"
        env:
          VAULT_ADDR: ${{ env.VAULT_ADDR }}
          VAULT_TOKEN: ${{ env.VAULT_TOKEN }}

      - name: 9. Verify Signature
        run: |
          cosign verify \
            --key "hashivault://cosign-key" \
            "${{ env.IMAGE_TAG }}"
        env:
          VAULT_ADDR: ${{ env.VAULT_ADDR }}
          VAULT_TOKEN: ${{ env.VAULT_TOKEN }}

      - name: 10. GitOps Commit - Update Image Tag
        if: github.ref == 'refs/heads/staging' && github.event_name == 'push'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          sed -i 's|image: ghcr.io/pikz-eng/nexus-app:.*|image: ghcr.io/pikz-eng/nexus-app:${{ github.sha }}|g' k8s/staging/deployment.yaml
          
          git add k8s/staging/deployment.yaml
          if ! git diff --quiet || ! git diff --staged --quiet; then
            git commit -m "chore(gitops): deploy image tag ${{ github.sha }} [skip ci]"
            git pull --rebase origin staging
            git push origin staging
          else
            echo "Nicio modificare de imagine necesară."
          fi
